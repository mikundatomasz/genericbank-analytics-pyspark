[project]
name = "genericbank-analytics-pyspark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "delta-spark==3.3.3",
    "numpy>=2.4.6",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genericbank"]
